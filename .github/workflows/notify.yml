name: daily-pm-digest

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, filter, and push today's articles
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 scripts/daily_digest.py

      - name: Commit and push updated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.md 已推送记录.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily digest $(date -u +%F)"
            git push
          else
            echo "No changes to commit"
          fi
